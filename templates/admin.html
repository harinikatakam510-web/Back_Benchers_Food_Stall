<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Admin | Back Benchers Food Stall</title>

    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/style.css') }}"
    />

    <style>
      .admin-page {
        width: 92%;
        max-width: 1200px;
        margin: auto;
        padding: 60px 0;
      }

      .admin-header {
        text-align: center;
        margin-bottom: 40px;
      }

      .admin-header p {
        color: #ff3d81;
        font-weight: bold;
      }

      .admin-header h1 {
        color: white;
        font-size: 48px;
        margin: 12px 0;
      }

      .admin-header span {
        color: #aaa;
      }

      /* ================= ACTIONS ================= */

      .admin-actions {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 25px;
        gap: 15px;
        flex-wrap: wrap;
      }

      .order-count {
        color: white;
        font-size: 20px;
        font-weight: bold;
      }

      .refresh-btn {
        border: none;
        background: #ff9d00;
        color: #111;
        padding: 12px 25px;
        border-radius: 25px;
        font-weight: bold;
        cursor: pointer;
      }

      .refresh-btn:hover {
        opacity: 0.9;
      }

      /* ================= ORDERS ================= */

      #orders-container {
        display: flex;
        flex-direction: column;
        gap: 20px;
      }

      .order-card {
        background: #1c1c1c;
        border: 1px solid #333;
        border-radius: 18px;
        padding: 25px;
      }

      .order-card.pending {
        border-color: #ff9d00;
      }

      .order-card.paid {
        border-color: #27c93f;
      }

      .order-card.rejected {
        border-color: #ff4d4d;
        opacity: 0.85;
      }

      /* ================= ORDER TOP ================= */

      .order-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 15px;
        flex-wrap: wrap;
        border-bottom: 1px solid #333;
        padding-bottom: 15px;
        margin-bottom: 18px;
      }

      .order-id {
        color: #ff9d00;
        font-size: 20px;
        font-weight: bold;
      }

      .order-time {
        color: #aaa;
        font-size: 14px;
      }

      /* ================= CUSTOMER ================= */

      .customer-info {
        margin-bottom: 20px;
      }

      .customer-info h3 {
        color: white;
        margin-bottom: 8px;
      }

      .customer-info p {
        color: #aaa;
        margin: 5px 0;
      }

      /* ================= ITEMS ================= */

      .items-title {
        color: #ff9d00;
        margin-bottom: 10px;
      }

      .order-item {
        background: #292929;
        padding: 12px 15px;
        border-radius: 10px;
        margin-bottom: 8px;
        display: flex;
        justify-content: space-between;
        gap: 15px;
        color: white;
      }

      .item-details {
        color: #aaa;
        font-size: 14px;
        margin-top: 4px;
      }

      .item-price {
        color: #ff9d00;
        font-weight: bold;
        white-space: nowrap;
      }

      /* ================= PAYMENT ================= */

      .payment-box {
        margin-top: 20px;
        padding: 18px;
        background: #242424;
        border-radius: 12px;
        border: 1px solid #3a3a3a;
      }

      .payment-box h3 {
        color: #ff9d00;
        margin-bottom: 12px;
      }

      .payment-row {
        display: flex;
        justify-content: space-between;
        gap: 15px;
        padding: 6px 0;
        flex-wrap: wrap;
      }

      .payment-label {
        color: #aaa;
      }

      .payment-value {
        color: white;
        font-weight: bold;
      }

      .utr-value {
        color: #ffc107;
        font-size: 17px;
        word-break: break-all;
      }

      /* ================= STATUS ================= */

      .status {
        display: inline-block;
        padding: 7px 15px;
        border-radius: 20px;
        font-weight: bold;
      }

      .status.pending {
        background: #33250f;
        color: #ff9d00;
      }

      .status.paid {
        background: #12351b;
        color: #27c93f;
      }

      .status.rejected {
        background: #3a1515;
        color: #ff4d4d;
      }

      /* ================= BOTTOM ================= */

      .order-bottom {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-top: 20px;
        padding-top: 18px;
        border-top: 1px solid #333;
        gap: 15px;
        flex-wrap: wrap;
      }

      .payment {
        color: white;
      }

      .payment span {
        color: #aaa;
      }

      .total {
        color: #ff9d00;
        font-size: 25px;
        font-weight: bold;
      }

      /* ================= ADMIN BUTTONS ================= */

      .admin-buttons {
        display: flex;
        gap: 12px;
        margin-top: 20px;
        flex-wrap: wrap;
      }

      .accept-btn,
      .reject-btn {
        border: none;
        padding: 12px 22px;
        border-radius: 25px;
        font-weight: bold;
        cursor: pointer;
        font-size: 14px;
      }

      .accept-btn {
        background: #27c93f;
        color: white;
      }

      .accept-btn:hover {
        background: #1fae34;
      }

      .reject-btn {
        background: #ff4d4d;
        color: white;
      }

      .reject-btn:hover {
        background: #dd3333;
      }

      /* ================= EMPTY ================= */

      .empty-orders {
        text-align: center;
        padding: 80px 20px;
        background: #1c1c1c;
        border: 1px solid #333;
        border-radius: 18px;
      }

      .empty-orders div {
        font-size: 55px;
      }

      .empty-orders h2 {
        color: white;
        margin: 15px 0;
      }

      .empty-orders p {
        color: #aaa;
      }

      /* ================= MOBILE ================= */

      @media (max-width: 700px) {
        .admin-header h1 {
          font-size: 38px;
        }

        .order-item {
          flex-direction: column;
        }

        .order-bottom {
          align-items: flex-start;
          flex-direction: column;
        }

        .payment-row {
          flex-direction: column;
          gap: 3px;
        }

        .admin-buttons {
          flex-direction: column;
        }

        .accept-btn,
        .reject-btn {
          width: 100%;
        }
      }
    </style>
  </head>

  <body>
    <!-- ================= NAVBAR ================= -->

    <header class="navbar">
      <div class="logo-area">
        <img
          src="{{ url_for('static', filename='images/logo.png') }}"
          alt="Back Benchers Logo"
        />

        <div>
          <h2>BACK BENCHERS</h2>
          <span>FOOD STALL</span>
        </div>
      </div>

      <nav>
        <a href="/">Home</a>
        <a href="/menu">Menu</a>
        <a href="/cart">🛒 Cart</a>
      </nav>
    </header>

    <!-- ================= ADMIN PAGE ================= -->

    <main class="admin-page">
      <section class="admin-header">
        <p>🔔 BACK BENCHERS • ORDER MANAGEMENT</p>

        <h1>Admin Orders</h1>

        <span>
          Paid orders appear here automatically. Use the buttons to move
          each order along.
        </span>
      </section>

      <!-- ================= ACTIONS ================= -->

      <div class="admin-actions">
        <div class="order-count">
          📦 Active Orders:
          <span id="order-count">0</span>
        </div>

        <button class="refresh-btn" type="button" onclick="loadOrders()">
          🔄 REFRESH ORDERS
        </button>
      </div>

      <!-- ================= ORDERS ================= -->

      <section id="orders-container">
        <div class="empty-orders">
          <div>📦</div>

          <h2>Loading Orders...</h2>

          <p>Please wait...</p>
        </div>
      </section>
    </main>

    <!-- ================= FOOTER ================= -->

    <footer>
      <h2>BACK BENCHERS</h2>

      <p>FOOD STALL</p>

      <span> Good Food ❤️ Good Friends ❤️ Great Times </span>
    </footer>

    <!-- ================= JAVASCRIPT ================= -->

    <script>
      /* =====================================================
         ESCAPE HTML
         Prevents customer-entered text from becoming HTML.
      ===================================================== */

      function escapeHTML(value) {
        if (value === null || value === undefined) {
          return "";
        }

        return String(value)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#039;");
      }

      /* =====================================================
         KITCHEN STATUS FLOW
         Confirmed -> Preparing -> Ready -> Completed
      ===================================================== */

      const NEXT_STATUS = {
        Confirmed: "Preparing",
        Preparing: "Ready",
        Ready: "Completed",
      };

      const STATUS_ICON = {
        Confirmed: "🆕",
        Preparing: "👨‍🍳",
        Ready: "✅",
        Completed: "📦",
        Cancelled: "❌",
      };

      let knownOrderIds = null;

      /* =====================================================
         LOAD ORDERS
      ===================================================== */

      function loadOrders() {
        fetch(location.origin + "/api/orders", { method: "GET", cache: "no-store" })
          .then(function (response) {
            if (response.status === 401) {
              throw new Error("Login expired. Please reload the page.");
            }

            if (!response.ok) {
              throw new Error("Unable to load orders.");
            }

            return response.json();
          })

          .then(function (data) {
            const container = document.getElementById("orders-container");

            const count = document.getElementById("order-count");

            const orders = (data.success && data.orders) || [];

            /* Beep when a new order arrives (not on first load). */

            const ids = orders.map(function (order) {
              return order.orderId;
            });

            if (
              knownOrderIds &&
              ids.some(function (id) {
                return !knownOrderIds.includes(id);
              })
            ) {
              beep();
            }

            knownOrderIds = ids;

            /* Active = not completed / cancelled */

            count.textContent = orders.filter(function (order) {
              return order.status !== "Completed" && order.status !== "Cancelled";
            }).length;

            container.innerHTML = "";

            if (orders.length === 0) {
              container.innerHTML = `
                <div class="empty-orders">
                  <div>🛒</div>
                  <h2>No Orders Yet</h2>
                  <p>Paid customer orders will appear here.</p>
                </div>
              `;

              return;
            }

            orders.forEach(function (order) {
              container.appendChild(renderOrder(order));
            });
          })

          .catch(function (error) {
            console.error("Order loading error:", error);

            document.getElementById("orders-container").innerHTML = `
              <div class="empty-orders">
                <div>⚠️</div>
                <h2>Unable to Load Orders</h2>
                <p>${escapeHTML(error.message)}</p>
              </div>
            `;
          });
      }

      /* =====================================================
         ONE ORDER CARD
      ===================================================== */

      function renderOrder(order) {
        const card = document.createElement("div");

        const status = order.status || "Confirmed";

        const isClosed = status === "Completed" || status === "Cancelled";

        card.className =
          "order-card " +
          (status === "Cancelled" ? "rejected" : isClosed ? "" : "paid");

        /* ITEMS */

        let itemsHTML = "";

        (order.items || []).forEach(function (item) {
          const quantity = Number(item.quantity) || 1;

          const itemTotal = (Number(item.price) || 0) * quantity;

          const details = [item.option, item.size]
            .filter(Boolean)
            .map(escapeHTML);

          details.push("Qty: " + quantity);

          itemsHTML += `
            <div class="order-item">
              <div>
                <strong>${escapeHTML(item.name)}</strong>
                <div class="item-details">${details.join(" • ")}</div>
              </div>
              <div class="item-price">₹${itemTotal.toFixed(2)}</div>
            </div>
          `;
        });

        /* BUTTONS */

        let buttonsHTML = "";

        if (!isClosed) {
          const next = NEXT_STATUS[status];

          buttonsHTML = `
            <div class="admin-buttons">
              ${
                next
                  ? `<button type="button" class="accept-btn"
                       data-order="${escapeHTML(order.orderId)}"
                       data-status="${next}">
                       ${STATUS_ICON[next]} MARK ${next.toUpperCase()}
                     </button>`
                  : ""
              }
              <button type="button" class="reject-btn"
                data-order="${escapeHTML(order.orderId)}"
                data-status="Cancelled">
                ❌ CANCEL ORDER
              </button>
            </div>
          `;
        }

        card.innerHTML = `
          <div class="order-top">
            <div class="order-id">🔔 ${escapeHTML(order.orderId)}</div>
            <div class="order-time">${escapeHTML(order.createdAt)}</div>
          </div>

          <div class="customer-info">
            <h3>👤 ${escapeHTML(order.customerName)}</h3>
            <p>📱 ${escapeHTML(order.phone)}</p>
            ${order.table ? `<p>🪑 ${escapeHTML(order.table)}</p>` : ""}
          </div>

          <h3 class="items-title">🧾 Ordered Items</h3>

          ${itemsHTML}

          <div class="payment-box">
            <h3>💳 Payment Details</h3>

            <div class="payment-row">
              <span class="payment-label">Payment Method</span>
              <span class="payment-value">${escapeHTML(order.payment || "Razorpay")}</span>
            </div>

            <div class="payment-row">
              <span class="payment-label">Razorpay Payment ID</span>
              <span class="utr-value">${escapeHTML(order.transactionId || "—")}</span>
            </div>

            <div class="payment-row">
              <span class="payment-label">Payment Status</span>
              <span class="status paid">${escapeHTML(order.paymentStatus || "Paid")}</span>
            </div>

            <div class="payment-row">
              <span class="payment-label">Order Status</span>
              <span class="status ${status === "Cancelled" ? "rejected" : "pending"}">
                ${STATUS_ICON[status] || ""} ${escapeHTML(status)}
              </span>
            </div>
          </div>

          <div class="order-bottom">
            <div class="payment">💳 Paid via <span>Razorpay</span></div>
            <div class="total">Total: ₹${Number(order.total || 0).toFixed(2)}</div>
          </div>

          ${buttonsHTML}
        `;

        card.querySelectorAll("button[data-status]").forEach(function (button) {
          button.addEventListener("click", function () {
            updateOrderStatus(button.dataset.order, button.dataset.status);
          });
        });

        return card;
      }

      /* =====================================================
         UPDATE ORDER STATUS
      ===================================================== */

      function updateOrderStatus(orderId, status) {
        if (
          status === "Cancelled" &&
          !confirm(
            "Cancel order " +
              orderId +
              "?\n\nThis does NOT refund the money. " +
              "Refund it from the Razorpay Dashboard if needed.",
          )
        ) {
          return;
        }

        fetch(location.origin + "/api/orders/" + encodeURIComponent(orderId) + "/status", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ status: status }),
        })
          .then(function (response) {
            return response.json();
          })

          .then(function (data) {
            if (!data.success) {
              throw new Error(data.message || "Unable to update order status.");
            }

            loadOrders();
          })

          .catch(function (error) {
            console.error("Status update error:", error);

            alert("Unable to update order status.\n\n" + error.message);
          });
      }

      /* =====================================================
         NEW ORDER SOUND
      ===================================================== */

      function beep() {
        try {
          const audio = new (window.AudioContext || window.webkitAudioContext)();

          const oscillator = audio.createOscillator();

          oscillator.frequency.value = 880;

          oscillator.connect(audio.destination);

          oscillator.start();

          oscillator.stop(audio.currentTime + 0.4);
        } catch (error) {
          /* Sound is optional. */
        }
      }

      /* =====================================================
         INITIAL LOAD + AUTO REFRESH (every 5 seconds)
      ===================================================== */

      document.addEventListener("DOMContentLoaded", loadOrders);

      setInterval(loadOrders, 5000);
    </script>
  </body>
</html>
